<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'"
    />
    <title>OpenSEO</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --fg: #18181b;
        --muted: #71717a;
        --track: #e4e4e7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --fg: #fafafa;
          --muted: #a1a1aa;
          --track: #27272a;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.5 "Segoe UI",
          system-ui,
          sans-serif;
        display: grid;
        place-items: center;
      }
      .box {
        text-align: center;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0 0 6px;
      }
      p {
        color: var(--muted);
        margin: 0 0 20px;
      }
      .bar {
        width: 220px;
        height: 4px;
        border-radius: 2px;
        background: var(--track);
        overflow: hidden;
        margin: 0 auto;
      }
      .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: var(--fg);
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>OpenSEO</h1>
      <p>Starting your local server…</p>
      <div class="bar"></div>
    </div>
  </body>
</html>
